services:
  mysql:
    image: mysql:8.0
    container_name: finance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    build: .
    container_name: finance-backend
    ports:
      - "8090:8090"
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/finance_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: root
      COLLECTOR_URL: http://finance-collector:8091
    volumes:
      - ./data:/app/data   # 持久化 LLM 配置(避免重建容器后被 Dockerfile COPY 覆盖)
    restart: always

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: finance-collector
    ports:
      - "8091:8091"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./dist-mobile:/usr/share/nginx/html-m:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./selfsigned.crt:/etc/nginx/ssl/selfsigned.crt:ro
      - ./selfsigned.key:/etc/nginx/ssl/selfsigned.key:ro
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data:
