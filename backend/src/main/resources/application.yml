server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: finance-system-backend
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8

  # 步骤④:MySQL 数据源(支持环境变量覆盖,便于 Docker / 华为云部署切换)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finance_system?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.finance: info
